<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'Images Épicerie / Grocery Image Generator</title>
    <script src="js/html2canvas.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #007bff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --capture-width: 1080px; /* Standard width for FB/IG high quality */
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* --- CONTROL PANEL --- */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border: 1px solid var(--border);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 { margin: 0; font-family: 'Poppins', sans-serif; font-size: 1.5rem; }

        input[type="date"] {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: inherit;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, filter 0.2s;
        }

        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        button.secondary { background-color: #6c757d; }

        /* --- PREVIEW GRID --- */
        #preview-area {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        /* --- CAPTURE CARD (The specific look of the generated image) --- */
        /* Note: We scale this down in the preview using zoom/transform, 
           but render it full size for html2canvas */
        .store-card-wrapper {
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .store-card {
            background-color: white;
            width: var(--capture-width); /* Fixed width for consistent output */
            /* Height is auto */
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 0; /* Square corners for images look better */
            display: flex;
            flex-direction: column;
            transform-origin: top left;
        }

        .preview-mode .store-card {
            /* This shrinks the huge 1080px card to fit in the preview grid */
            transform: scale(0.3); 
            margin-bottom: -70%; /* Compensate for the scale whitespace */
            margin-right: -70%;
            border: 1px solid #ccc;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 20px;
        }

        .card-header img.store-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
        }

        .date-badge {
            background-color: #dc3545;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-align: right;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 items per row for cleaner look */
            gap: 20px;
        }

        .grocery-item {
            position: relative;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }

        .grocery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Items clicked to be hidden */
        .grocery-item.excluded {
            opacity: 0.3;
            filter: grayscale(100%);
            position: relative;
        }
        .grocery-item.excluded::after {
            content: "X";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: red;
            font-weight: bold;
            pointer-events: none;
        }

        /* Hide excluded items during actual capture */
        body.capturing .grocery-item.excluded {
            display: none !important;
        }

        .card-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            text-align: center;
            font-size: 20px;
            color: #777;
            font-weight: bold;
        }

        /* --- DOWNLOAD BUTTONS PER CARD --- */
        .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .hidden { display: none; }
        
        /* Loading Overlay */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(255,255,255,0.9);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="loader" class="hidden">
    <div style="margin-bottom: 15px;">Processing...</div>
    <div id="loader-text" style="font-size: 16px; font-weight: normal;"></div>
</div>

<div class="controls">
    <div class="controls-header">
        <h1>
            <span class="lang-fr">Générateur d'Images</span>
            <span class="lang-en hidden">Image Generator</span>
        </h1>
        <div>
            <label>
                <input type="radio" name="lang" value="fr" checked> Français
            </label>
            <label>
                <input type="radio" name="lang" value="en"> English
            </label>
        </div>
    </div>
    
    <div class="control-row">
        <div>
            <label for="startDate">
                <span class="lang-fr">Date de début (Jeudi) :</span>
                <span class="lang-en hidden">Start Date (Thursday):</span>
            </label>
            <input type="date" id="startDate">
        </div>
        
        <button id="updateDatesBtn" class="secondary">
            <span class="lang-fr">Mettre à jour les dates</span>
            <span class="lang-en hidden">Update Dates</span>
        </button>

        <div style="margin-left: auto;">
             <span class="lang-fr" style="font-size: 0.9em; color: #666;">Cliquez sur un item pour l'exclure.</span>
             <span class="lang-en hidden" style="font-size: 0.9em; color: #666;">Click an item to exclude it.</span>
        </div>
    </div>
</div>

<div id="preview-area">
    <!-- Stores will be injected here -->
</div>

<script>
    // --- CONFIGURATION ---
    const logoFolder = 'images/logo/';
    const groceriesFolder = 'images/weekly-groceries/';
    const stores = {
        'IGA': { logo: 'iga.png', days: 6 },
        'Maxi': { logo: 'Maxi.png', days: 6 },
        'Metro': { logo: 'metro.png', days: 6 },
        'Super C': { logo: 'superc.png', days: 6 },
        'Adonis': { logo: 'adonis.png', days: 6 },
        'Marché Richelieu': { logo: 'marcherichelieu.png', days: 6 },
        'Provigo': { logo: 'Provigo.png', days: 6 },
        'Supermarché PA': { logo: 'supermarchepa.png', days: 3 }, // Special Case: Ends Sunday
        'Tigre Géant': { logo: 'tigregeant.png', days: 6 },
        'Val-Mont': { logo: 'valmont.png', days: 6 } // Assuming logic
    };

    const textContent = {
        fr: {
            from: "Du",
            to: "au",
            inclusive: "inclusivement",
            footer: "Liste par /u/eranumerique - https://eranumerique.github.io/",
            download: "Télécharger Image",
            generating: "Génération en cours...",
            months: ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"]
        },
        en: {
            from: "From",
            to: "to",
            inclusive: "inclusive",
            footer: "List by /u/eranumerique - https://eranumerique.github.io/",
            download: "Download Image",
            generating: "Generating...",
            months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
        }
    };

    let currentLang = 'fr';
    let groceryData = [];

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', async () => {
        // Set default date to next Thursday (or today if Thursday)
        setDefaultDate();

        // Load Data
        try {
            const response = await fetch('groceries.json');
            groceryData = await response.json();
            renderAllStores();
        } catch (e) {
            console.error("Error loading groceries.json", e);
            alert("Error loading data.");
        }

        // Event Listeners
        document.querySelectorAll('input[name="lang"]').forEach(el => {
            el.addEventListener('change', (e) => switchLanguage(e.target.value));
        });

        document.getElementById('updateDatesBtn').addEventListener('click', updateAllCardDates);
    });

    // --- LOGIC ---

    function setDefaultDate() {
        const today = new Date();
        const day = today.getDay(); // 0=Sun, 4=Thu
        const diff = (4 - day + 7) % 7; // Days until next Thursday. If today is Thu, diff=0
        
        // If today is Friday-Wednesday, usually we want the *upcoming* Thursday? 
        // Or if today is Thursday, we want today.
        // Let's assume standard logic: set to nearest previous Thursday or Today.
        // Actually, usually these lists are prepared on Wed/Thu. Let's default to "This Thursday"
        
        const nextThursday = new Date(today);
        nextThursday.setDate(today.getDate() + diff);
        
        // However, if we are browsing on Monday, we probably want the *current* flyer (past Thursday).
        // Let's just set input value to today for now, user can change.
        document.getElementById('startDate').valueAsDate = new Date();
    }

    function switchLanguage(lang) {
        currentLang = lang;
        
        // UI Text
        document.querySelectorAll('.lang-fr').forEach(el => el.classList.toggle('hidden', lang !== 'fr'));
        document.querySelectorAll('.lang-en').forEach(el => el.classList.toggle('hidden', lang !== 'en'));

        // Re-render date texts and footers
        updateAllCardDates();
    }

    function formatDate(dateObj, lang) {
        const d = dateObj.getDate();
        const m = textContent[lang].months[dateObj.getMonth()];
        return `${d} ${m}`;
    }

    function getStoreDateString(storeName, startDateStr) {
        if (!startDateStr) return "";
        
        const start = new Date(startDateStr + "T12:00:00"); // Noon to avoid timezone shift issues
        const daysToAdd = stores[storeName] ? stores[storeName].days : 6;
        
        const end = new Date(start);
        end.setDate(start.getDate() + daysToAdd);

        const txt = textContent[currentLang];
        
        // Logic for English formatting vs French formatting
        if (currentLang === 'fr') {
            return `${txt.from} ${start.getDate()} ${txt.to} ${formatDate(end, 'fr')} ${txt.inclusive}`;
        } else {
            return `${txt.from} ${formatDate(start, 'en')} ${txt.to} ${formatDate(end, 'en')} ${txt.inclusive}`;
        }
    }

    function updateAllCardDates() {
        const inputDate = document.getElementById('startDate').value;
        const txt = textContent[currentLang];

        for (const store in stores) {
            const card = document.getElementById(`card-${store.replace(/\s+/g, '')}`);
            if (card) {
                // Update Date
                const dateEl = card.querySelector('.date-text');
                if (dateEl) dateEl.innerText = getStoreDateString(store, inputDate);

                // Update Footer
                const footEl = card.querySelector('.card-footer');
                if (footEl) footEl.innerText = txt.footer;

                // Update Button Text
                const btnEl = document.getElementById(`btn-${store.replace(/\s+/g, '')}`);
                if (btnEl) btnEl.innerText = txt.download;
            }
        }
    }

    function renderAllStores() {
        const container = document.getElementById('preview-area');
        container.innerHTML = '';
        const inputDate = document.getElementById('startDate').value;

        // Group files by store
        const storeItems = {};
        groceryData.forEach(filename => {
            // Find which store matches filename
            // Check specifically for PA match first to avoid partial matches
            let detectedStore = null;
            if (filename.toLowerCase().includes('supermarche pa')) {
                detectedStore = 'Supermarché PA';
            } else {
                detectedStore = Object.keys(stores).find(s => filename.includes(s));
            }

            if (detectedStore) {
                if (!storeItems[detectedStore]) storeItems[detectedStore] = [];
                storeItems[detectedStore].push(filename);
            }
        });

        // Build HTML for each store present in data
        for (const [storeName, items] of Object.entries(storeItems)) {
            const storeId = storeName.replace(/\s+/g, '');
            const logoSrc = logoFolder + (stores[storeName]?.logo || 'default.png');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'store-card-wrapper preview-mode';
            
            // HTML Structure for the Card
            const cardHtml = `
                <div class="store-card" id="card-${storeId}">
                    <div class="card-header">
                        <img src="${logoSrc}" class="store-logo" alt="${storeName}">
                        <div class="date-badge">
                            <span class="date-text">${getStoreDateString(storeName, inputDate)}</span>
                        </div>
                    </div>
                    <div class="items-grid">
                        ${items.map(img => `
                            <div class="grocery-item" onclick="this.classList.toggle('excluded')">
                                <img src="${groceriesFolder + img}" crossorigin="anonymous">
                            </div>
                        `).join('')}
                    </div>
                    <div class="card-footer">
                        ${textContent[currentLang].footer}
                    </div>
                </div>
                <div class="card-actions">
                    <button onclick="downloadStoreImage('${storeId}', '${storeName}')" id="btn-${storeId}">
                        ${textContent[currentLang].download}
                    </button>
                </div>
            `;
            
            wrapper.innerHTML = cardHtml;
            container.appendChild(wrapper);
        }
    }

    async function downloadStoreImage(storeId, storeName) {
        const wrapper = document.getElementById(`card-${storeId}`).parentElement;
        const card = document.getElementById(`card-${storeId}`);
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');

        // UI Feedback
        loader.classList.remove('hidden');
        loaderText.innerText = `${textContent[currentLang].generating} ${storeName}`;

        // 1. Temporarily remove scale transform and 'preview-mode' to render full res
        //    Actually, html2canvas renders what is in DOM. 
        //    To get high res, we strip the 'preview-mode' class which does the scaling.
        wrapper.classList.remove('preview-mode');
        
        // 2. Add 'capturing' class to body to hide excluded items completely via CSS
        document.body.classList.add('capturing');

        // 3. Wait a tick for reflow
        await new Promise(r => setTimeout(r, 100));

        try {
            const canvas = await html2canvas(card, {
                scale: 1, // We already sized the card at 1080px via CSS
                useCORS: true, // Important for local images sometimes depending on server
                backgroundColor: "#ffffff",
                scrollX: 0,
                scrollY: 0,
                windowWidth: document.documentElement.offsetWidth,
                windowHeight: document.documentElement.offsetHeight
            });

            // 4. Download
            const dateStr = document.getElementById('startDate').value || 'date';
            const cleanName = storeName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const fileName = `${dateStr}_${cleanName}.png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL("image/png");
            link.click();

        } catch (err) {
            console.error(err);
            alert("Erreur/Error generating image.");
        } finally {
            // Restore state
            wrapper.classList.add('preview-mode');
            document.body.classList.remove('capturing');
            loader.classList.add('hidden');
        }
    }

</script>

</body>
</html>
