<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'Images Épicerie / Grocery Image Generator</title>
    <!-- Ensure html2canvas.min.js is in a 'js' folder next to this file -->
    <script src="js/html2canvas.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #007bff;
            --text-main: #212529;
            --border: #dee2e6;
            --capture-width: 1080px; /* High quality social media width */
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* --- CONTROL PANEL --- */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border: 1px solid var(--border);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 { margin: 0; font-family: 'Poppins', sans-serif; font-size: 1.5rem; }

        input[type="date"] {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: inherit;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, filter 0.2s;
        }

        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        button.secondary { background-color: #6c757d; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* --- PREVIEW GRID --- */
        #preview-area {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        /* --- STORE CARD STYLING --- */
        .store-card-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        /* 
           The .store-card class defines the look of the generated image.
           In the preview, we scale this down significantly.
        */
        .store-card {
            background-color: white;
            width: var(--capture-width); 
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            
            /* Preview scaling magic */
            transform-origin: top left;
            transform: scale(0.32); /* Scale down to fit in grid */
            margin-bottom: -68%; /* Pull up the empty space caused by scaling */
            margin-right: -68%;
            border: 1px solid #ccc;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 20px;
        }

        .card-header img.store-logo {
            height: 120px; /* Large logos for HD */
            width: auto;
            object-fit: contain;
            max-width: 400px;
        }

        .date-badge {
            background-color: #dc3545;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 28px; /* Large text for HD */
            font-weight: bold;
            text-align: right;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columns layout */
            gap: 20px;
        }

        .grocery-item {
            position: relative;
            border: 2px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .grocery-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .grocery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Excluded State (Visual only) */
        .grocery-item.excluded {
            opacity: 0.2;
            filter: grayscale(100%);
        }
        .grocery-item.excluded::after {
            content: "X";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            color: red;
            font-weight: bold;
            pointer-events: none;
        }

        .card-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 3px solid #f0f0f0;
            text-align: center;
            font-size: 24px;
            color: #555;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 350px; /* Match grid column width */
        }

        .hidden { display: none !important; }

        /* Loading Overlay */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(255,255,255,0.9);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
        }

        /* 
           STAGING AREA 
           This is off-screen. We clone the card here to capture it without 
           transforms/scaling interfering with html2canvas.
        */
        #capture-stage {
            position: absolute;
            top: 0;
            left: -9999px; /* Hide off-screen */
            width: var(--capture-width);
            /* Ensure styles are reset */
            transform: none !important; 
            margin: 0 !important;
        }
        
        /* Ensure the card inside stage looks correct */
        #capture-stage .store-card {
            transform: none !important;
            margin: 0 !important;
            border: none;
        }
    </style>
</head>
<body>

<!-- Hidden Staging Area for HTML2Canvas -->
<div id="capture-stage"></div>

<!-- Loader -->
<div id="loader" class="hidden">
    <div style="margin-bottom: 15px;">Traitement en cours / Processing...</div>
    <div id="loader-text" style="font-size: 18px; font-weight: normal; color: #555;"></div>
</div>

<!-- Controls -->
<div class="controls">
    <div class="controls-header">
        <h1>
            <span class="lang-fr">Générateur d'Images pour Facebook</span>
            <span class="lang-en hidden">Facebook Image Generator</span>
        </h1>
        <div>
            <label style="cursor:pointer; margin-right: 15px;">
                <input type="radio" name="lang" value="fr" checked> Français
            </label>
            <label style="cursor:pointer;">
                <input type="radio" name="lang" value="en"> English
            </label>
        </div>
    </div>
    
    <div class="control-row">
        <div>
            <label for="startDate">
                <span class="lang-fr">Date de début (Jeudi) :</span>
                <span class="lang-en hidden">Start Date (Thursday):</span>
            </label>
            <input type="date" id="startDate">
        </div>
        
        <button id="updateDatesBtn" class="secondary">
            <span class="lang-fr">Mettre à jour les dates</span>
            <span class="lang-en hidden">Update Dates</span>
        </button>

        <button id="downloadAllBtn" style="background-color: #28a745;">
            <span class="lang-fr">Tout Télécharger (Zip non inclus, individuel)</span>
            <span class="lang-en hidden">Download All (Individual files)</span>
        </button>

        <div style="margin-left: auto;">
             <span class="lang-fr" style="font-size: 0.9em; color: #666;">Cliquez sur un item pour l'exclure (X).</span>
             <span class="lang-en hidden" style="font-size: 0.9em; color: #666;">Click an item to exclude it (X).</span>
        </div>
    </div>
</div>

<!-- Grid -->
<div id="preview-area">
    <!-- Stores will be injected here -->
</div>

<script>
    // === CONFIGURATION ===
    const logoFolder = 'images/logo/';
    const groceriesFolder = 'images/weekly-groceries/';
    
    const stores = {
        'IGA': { logo: 'iga.png', days: 6 },
        'Maxi': { logo: 'Maxi.png', days: 6 },
        'Metro': { logo: 'metro.png', days: 6 },
        'Super C': { logo: 'superc.png', days: 6 },
        'Adonis': { logo: 'adonis.png', days: 6 },
        'Marché Richelieu': { logo: 'marcherichelieu.png', days: 6 },
        'Provigo': { logo: 'Provigo.png', days: 6 },
        'Supermarché PA': { logo: 'supermarchepa.png', days: 3 }, // Thu -> Sun
        'Tigre Géant': { logo: 'tigregeant.png', days: 6 },
        'Val-Mont': { logo: 'valmont.png', days: 6 }
    };

    const textContent = {
        fr: {
            from: "Du",
            to: "au",
            inclusive: "inclusivement",
            footer: "Liste par /u/eranumerique - https://eranumerique.github.io/ <br> Facebook : Rabais Épicerie au Québec",
            download: "Télécharger",
            generating: "Génération :",
            months: ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"]
        },
        en: {
            from: "From",
            to: "to",
            inclusive: "inclusive",
            footer: "List by /u/eranumerique - https://eranumerique.github.io/",
            download: "Download",
            generating: "Generating:",
            months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
        }
    };

    let currentLang = 'fr';
    let groceryData = [];

    // === INITIALIZATION ===
    document.addEventListener('DOMContentLoaded', async () => {
        setDefaultDate();
        
        try {
            const response = await fetch('groceries.json');
            if (!response.ok) throw new Error("File not found");
            groceryData = await response.json();
            renderAllStores();
        } catch (e) {
            console.error("Error loading groceries.json", e);
            document.getElementById('preview-area').innerHTML = `<div style="padding:20px; color:red;">Erreur: Impossible de charger groceries.json. Assurez-vous que le fichier est présent.</div>`;
        }

        // Listeners
        document.querySelectorAll('input[name="lang"]').forEach(el => {
            el.addEventListener('change', (e) => switchLanguage(e.target.value));
        });
        document.getElementById('updateDatesBtn').addEventListener('click', updateAllCardDates);
        document.getElementById('downloadAllBtn').addEventListener('click', downloadAllImages);
    });

    // === LOGIC ===

    function setDefaultDate() {
        const today = new Date();
        const day = today.getDay(); // 0=Dim, 1=Lun, 2=Mar, 3=Mer, 4=Jeu, 5=Ven, 6=Sam
        
        // Calculer le nombre de jours à ajouter pour arriver au PROCHAIN jeudi
        // Si on est déjà jeudi (4), on peut décider de rester à aujourd'hui (0) 
        // ou d'avancer de 7 jours. Ici, on avance seulement si on n'est pas encore jeudi.
        let daysUntilThursday = (4 - day + 7) % 7;

        // Si vous voulez que, même le jeudi, il propose celui de la semaine SUIVANTE,
        // changez la ligne au-dessus par : 
        // let daysUntilThursday = (4 - day + 7) % 7 || 7;

        const target = new Date(today);
        target.setDate(today.getDate() + daysUntilThursday);

        // Formatage AAAA-MM-JJ pour l'input date
        const yyyy = target.getFullYear();
        const mm = String(target.getMonth() + 1).padStart(2, '0');
        const dd = String(target.getDate()).padStart(2, '0');
        
        document.getElementById('startDate').value = `${yyyy}-${mm}-${dd}`;
        
        // On force la mise à jour des textes sur les cartes immédiatement
        updateAllCardDates();
    }

    function switchLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-fr').forEach(el => el.classList.toggle('hidden', lang !== 'fr'));
        document.querySelectorAll('.lang-en').forEach(el => el.classList.toggle('hidden', lang !== 'en'));
        updateAllCardDates();
    }

    function formatDate(dateObj, lang) {
        const d = dateObj.getDate();
        const m = textContent[lang].months[dateObj.getMonth()];
        return `${d} ${m}`;
    }

    function getStoreDateString(storeName, startDateStr) {
    if (!startDateStr) return "";
    
    // Correction du fuseau horaire avec T12:00:00
    const start = new Date(startDateStr + "T12:00:00"); 
    const daysToAdd = stores[storeName] ? stores[storeName].days : 6;
    const end = new Date(start);
    end.setDate(start.getDate() + daysToAdd);

    const txt = textContent[currentLang];
    
    // On vérifie si les mois sont différents
    const showStartMonth = start.getMonth() !== end.getMonth();

    if (currentLang === 'fr') {
        // Si mois différents : "Du 29 janvier au 4 février"
        // Si même mois : "Du 29 au 4 février"
        const startPart = showStartMonth 
            ? `${start.getDate()} ${txt.months[start.getMonth()]}` 
            : `${start.getDate()}`;
            
        return `${txt.from} ${startPart} ${txt.to} ${formatDate(end, 'fr')} ${txt.inclusive}`;
    } else {
        // En anglais, on affiche généralement toujours le mois pour la clarté
        return `${txt.from} ${formatDate(start, 'en')} ${txt.to} ${formatDate(end, 'en')} ${txt.inclusive}`;
    }
}

    function updateAllCardDates() {
        const inputDate = document.getElementById('startDate').value;
        const txt = textContent[currentLang];

        for (const store in stores) {
            const card = document.getElementById(`card-${store.replace(/\s+/g, '')}`);
            if (card) {
                // Update Date
                const dateEl = card.querySelector('.date-text');
                if (dateEl) dateEl.innerText = getStoreDateString(store, inputDate);
                // Update Footer
                const footEl = card.querySelector('.card-footer');
                if (footEl) footEl.innerHTML = txt.footer;
                // Update Button
                const btnEl = document.getElementById(`btn-${store.replace(/\s+/g, '')}`);
                if (btnEl) btnEl.innerText = `${txt.download} ${store}`;
            }
        }
    }

    function renderAllStores() {
        const container = document.getElementById('preview-area');
        container.innerHTML = '';
        const inputDate = document.getElementById('startDate').value;

        // Group files by store
        const storeItems = {};
        groceryData.forEach(filename => {
            // Store detection logic
            let detectedStore = null;
            if (filename.toLowerCase().includes('supermarche pa')) {
                detectedStore = 'Supermarché PA';
            } else {
                detectedStore = Object.keys(stores).find(s => filename.includes(s));
            }

            if (detectedStore) {
                if (!storeItems[detectedStore]) storeItems[detectedStore] = [];
                storeItems[detectedStore].push(filename);
            }
        });

        // Generate HTML
        for (const [storeName, items] of Object.entries(storeItems)) {
            const storeId = storeName.replace(/\s+/g, '');
            // Use default logo if store not in config
            const logoFile = stores[storeName]?.logo || 'iga.png'; 
            const logoSrc = logoFolder + logoFile;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'store-card-wrapper';
            wrapper.dataset.storeId = storeId;
            wrapper.dataset.storeName = storeName;
            
            const cardHtml = `
                <div class="store-card" id="card-${storeId}">
                    <div class="card-header">
                        <img src="${logoSrc}" class="store-logo" alt="${storeName}">
                        <div class="date-badge">
                            <span class="date-text">${getStoreDateString(storeName, inputDate)}</span>
                        </div>
                    </div>
                    <div class="items-grid">
                        ${items.map(img => `
                            <div class="grocery-item" onclick="this.classList.toggle('excluded')">
                                <img src="${groceriesFolder + img}" loading="lazy">
                            </div>
                        `).join('')}
                    </div>
                    <div class="card-footer">
                        ${textContent[currentLang].footer}
                    </div>
                </div>
                <div class="card-actions">
                    <button onclick="singleDownload('${storeId}', '${storeName}')" id="btn-${storeId}">
                        ${textContent[currentLang].download} ${storeName}
                    </button>
                </div>
            `;
            
            wrapper.innerHTML = cardHtml;
            container.appendChild(wrapper);
        }
    }

    // === IMAGE GENERATION LOGIC (THE FIX) ===
    
    async function singleDownload(storeId, storeName) {
        showLoader(true, storeName);
        // Small delay to let UI render the loader
        await new Promise(r => setTimeout(r, 50));
        await generateAndDownload(storeId, storeName);
        showLoader(false);
    }

    async function downloadAllImages() {
        const wrappers = document.querySelectorAll('.store-card-wrapper');
        const btn = document.getElementById('downloadAllBtn');
        btn.disabled = true;

        for (const wrap of wrappers) {
            const id = wrap.dataset.storeId;
            const name = wrap.dataset.storeName;
            showLoader(true, name);
            // Wait a bit to ensure browser stays responsive
            await new Promise(r => setTimeout(r, 200));
            await generateAndDownload(id, name);
        }
        
        showLoader(false);
        btn.disabled = false;
        alert("Terminé / Done!");
    }

    async function generateAndDownload(storeId, storeName) {
        const sourceCard = document.getElementById(`card-${storeId}`);
        const stage = document.getElementById('capture-stage');
        
        // 1. Clone the card to the staging area
        const clone = sourceCard.cloneNode(true);
        
        // 2. Remove excluded items from the clone DOM completely
        //    (so there are no gaps in the grid)
        const grid = clone.querySelector('.items-grid');
        const items = Array.from(grid.children);
        
        // In the original card, clicked items have class 'excluded'
        // We check the original indices to know which to remove in clone
        // OR simpler: check if the clone has the class (cloneNode copies classes)
        const excludedInClone = clone.querySelectorAll('.grocery-item.excluded');
        excludedInClone.forEach(el => el.remove());

        // 3. Mount clone to stage
        stage.innerHTML = '';
        stage.appendChild(clone);

        // 4. Force wait for images in clone to be "ready" (even though cached)
        const images = Array.from(clone.querySelectorAll('img'));
        await Promise.all(images.map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve; // Continue even if error
            });
        }));

        // 5. Run html2canvas on the clean, full-size clone
        try {
            const canvas = await html2canvas(clone, {
                scale: 1, // 1:1 because our CSS defines .store-card as 1080px wide
                useCORS: true,
                backgroundColor: "#ffffff",
                windowWidth: 1920, // Pretend huge window to avoid scrollbars in capture
                logging: false,
                imageTimeout: 5000 // 5s timeout max
            });

            // 6. Trigger Download
            const dateStr = document.getElementById('startDate').value || 'date';
            // Sanitize filename
            const safeName = storeName.replace(/[^a-z0-9]/gi, '').toLowerCase();
            const fileName = `${dateStr}_${safeName}.png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL("image/png");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        } catch (err) {
            console.error("Capture failed:", err);
            alert("Erreur lors de la capture de " + storeName);
        } finally {
            // Clean stage
            stage.innerHTML = '';
        }
    }

    function showLoader(show, text="") {
        const l = document.getElementById('loader');
        const t = document.getElementById('loader-text');
        if (show) {
            l.classList.remove('hidden');
            t.innerText = `${textContent[currentLang].generating} ${text}`;
        } else {
            l.classList.add('hidden');
        }
    }

</script>

</body>
</html>
